<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>D館AR | 最初の祭札</title>
  <link rel="stylesheet" href="./style.css">

  <style>
    html,
    body.ar-page {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
    }

    body.ar-page::after { display: none !important; }

    body.ar-page > video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -2 !important;
    }

    body.ar-page .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      z-index: -1 !important;
    }

    .success-panel {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 50;
      display: none;
      width: min(calc(100% - 28px), 430px);
      transform: translateX(-50%);
      padding: 18px;
      color: #281e29;
      background: rgba(246, 237, 218, .97);
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .success-panel.is-visible { display: block; }

    .success-panel strong {
      display: block;
      margin-bottom: 7px;
      font-size: 1.25rem;
    }

    .success-panel p {
      margin: 0 0 13px;
    }

    .success-panel a {
      display: block;
      width: 100%;
      padding: 13px 16px;
      color: #fff8e8;
      background: linear-gradient(180deg, #aa3b41, #7e222b);
      border: 1px solid #681a22;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body class="ar-page">
  <div class="ar-hud">
    <div class="ar-card">
      <h1>最初の祭札を探せ</h1>
      <p>
        D館入口の「D-Center」をカメラに写してください。
        看板全体と、その周囲が少し入るようにすると認識しやすいです。
      </p>
    </div>
  </div>

  <div class="ar-tip" id="arTip">D-Centerをカメラに映してください…</div>

  <div class="success-panel" id="successPanel" aria-live="polite">
    <strong>最初の祭札を発見した！</strong>
    <p>祭札「ず」を取り戻した。次の記憶を探しに行こう。</p>
    <a href="./index.html?v=9">本編に戻る</a>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets/d-center.mind; autoStart: true; maxTrack: 1; uiScanning: true; uiLoading: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <img id="zuTicket" src="./assets/ui/festival-card-zu.png" alt="祭札 ず">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane
        id="ticketPlane"
        src="#zuTicket"
        position="0 0.22 0.03"
        height="0.68"
        width="0.54"
        transparent="true"
        animation="property: position; to: 0 0.30 0.03; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    const target = document.getElementById("target");
    const arTip = document.getElementById("arTip");
    const successPanel = document.getElementById("successPanel");
    let found = false;

    target.addEventListener("targetFound", () => {
      if (found) return;
      found = true;

      localStorage.setItem("d-center-ar-success", "true");
      arTip.style.display = "none";

      if (navigator.vibrate) {
        navigator.vibrate([60, 40, 90]);
      }

      // AR上の「ず」を見せてから、下に確認パネルを出す。
      window.setTimeout(() => {
        successPanel.classList.add("is-visible");
      }, 1200);
    });
  </script>
</body>
</html>
