<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>D館AR | 第一の記憶</title>
  <link rel="stylesheet" href="./style.css">

  <style>
    html,
    body.ar-page {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      overscroll-behavior: none;
    }

    body.ar-page::after {
      display: none !important;
    }

    body.ar-page > video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -2 !important;
    }

    body.ar-page .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      z-index: -1 !important;
    }

    .walk-guide {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 35;
      display: none;
      width: min(calc(100% - 24px), 440px);
      transform: translateX(-50%);
      padding: 15px 16px;
      color: #fff8e8;
      background: rgba(10, 12, 22, 0.82);
      border-radius: 15px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .walk-guide.is-visible {
      display: block;
    }

    .walk-guide strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1.05rem;
    }

    .walk-guide p {
      margin: 0 0 12px;
      line-height: 1.6;
      font-size: .92rem;
    }

    .walk-guide button {
      width: 100%;
      padding: 13px 16px;
      color: #fff8e8;
      background: linear-gradient(180deg, #aa3b41, #7e222b);
      border: 1px solid #681a22;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
    }

    .result-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(8, 10, 18, .5);
      backdrop-filter: blur(4px);
    }

    .result-overlay.is-visible {
      display: grid;
    }

    .result-card {
      width: min(100%, 430px);
      padding: 23px 20px;
      color: #281e29;
      background: rgba(246, 237, 218, .97);
      border-radius: 18px;
      text-align: center;
    }

    .festival-ticket {
      display: grid;
      width: 126px;
      height: 166px;
      margin: 0 auto 17px;
      place-items: center;
      color: #f8e5a8;
      background: #7e222b;
      border: 4px double #d7a84a;
      border-radius: 9px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 4.7rem;
    }

    .result-card h2 {
      margin: 0 0 10px;
    }

    .result-card p {
      margin: 0 0 16px;
      line-height: 1.7;
    }

    .result-card a {
      display: block;
      width: 100%;
      padding: 14px 16px;
      color: #fff8e8;
      background: linear-gradient(180deg, #aa3b41, #7e222b);
      border: 1px solid #681a22;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    AFRAME.registerComponent("fit-kioku-model", {
      init() {
        this.el.addEventListener("model-loaded", () => {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh) return;

          const box = new THREE.Box3().setFromObject(mesh);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          const targetSize = 0.88;
          const scale = targetSize / Math.max(size.x, size.y, size.z);

          mesh.scale.setScalar(scale);
          mesh.position.set(
            -center.x * scale,
            -center.y * scale,
            -center.z * scale
          );
        });
      }
    });
  </script>
</head>

<body class="ar-page">
  <div class="ar-hud">
    <div class="ar-card">
      <h1>最初の祭札を探せ</h1>
      <p>
        D館入口の「D-Center」をカメラに写してください。
        模型が現れたら、看板をなるべく画面に残したまま左右に回り込み、
        正しい方向から文字を読み取ってください。
      </p>
    </div>
  </div>

  <div class="ar-tip" id="arTip">D-Centerをカメラに映してください…</div>

  <div class="walk-guide" id="walkGuide">
    <strong>自分が動いて、見える角度を探そう</strong>
    <p>
      指で模型は回せません。スマホを持ったまま少しずつ左右へ移動して、
      文字として読める場所を探してください。
    </p>
    <button id="confirmButton" type="button">読めた！</button>
  </div>

  <div class="result-overlay" id="resultOverlay" aria-live="polite">
    <div class="result-card">
      <div class="festival-ticket" aria-label="祭札 ず">ず</div>
      <h2>最初の祭札を発見した！</h2>
      <p>第一の記憶がよみがえった。祭札「ず」を取り戻した。</p>
      <a href="./index.html?v=10">本編に戻る</a>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets/d-center.mind; autoStart: true; maxTrack: 1; uiScanning: true; uiLoading: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <a-asset-item id="kiokuAsset" src="./assets/models/kioku.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!--
        モデル自体は固定。
        ユーザーがD-Centerの周囲を左右に移動して視点を変える。
        指による回転操作は入れていません。
      -->
      <a-entity id="modelAnchor" position="0 0.02 0.28">
        <a-entity
          id="kiokuModel"
          gltf-model="#kiokuAsset"
          fit-kioku-model
          rotation="0 0 0">
        </a-entity>
      </a-entity>

      <a-ring
        color="#d7a84a"
        radius-inner="0.36"
        radius-outer="0.39"
        position="0 -0.12 0.03"
        opacity="0.8">
      </a-ring>

      <a-entity light="type: ambient; intensity: 1.35"></a-entity>
      <a-entity light="type: directional; intensity: 1.2" position="-1 2 2"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const target = document.getElementById("target");
    const arTip = document.getElementById("arTip");
    const walkGuide = document.getElementById("walkGuide");
    const confirmButton = document.getElementById("confirmButton");
    const resultOverlay = document.getElementById("resultOverlay");

    let targetVisible = false;
    let completed = localStorage.getItem("d-center-ar-success") === "true";

    target.addEventListener("targetFound", () => {
      targetVisible = true;
      arTip.style.display = "none";

      if (!completed) {
        walkGuide.classList.add("is-visible");
      }
    });

    target.addEventListener("targetLost", () => {
      targetVisible = false;

      if (!completed) {
        walkGuide.classList.remove("is-visible");
        arTip.style.display = "block";
      }
    });

    confirmButton.addEventListener("click", () => {
      if (!targetVisible || completed) return;

      completed = true;
      localStorage.setItem("d-center-ar-success", "true");
      walkGuide.classList.remove("is-visible");

      if (navigator.vibrate) {
        navigator.vibrate([60, 40, 90]);
      }

      resultOverlay.classList.add("is-visible");
    });
  </script>
</body>
</html>
