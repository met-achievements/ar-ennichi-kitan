<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>D館AR | 第一の記憶</title>
  <link rel="stylesheet" href="./style.css">

  <style>
    html,
    body.ar-page {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      overscroll-behavior: none;
    }

    body.ar-page::after { display: none !important; }

    body.ar-page > video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: -2 !important;
    }

    body.ar-page .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      z-index: -1 !important;
    }

    .walk-guide {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 40;
      display: none;
      width: min(calc(100% - 24px), 440px);
      transform: translateX(-50%);
      padding: 14px 15px;
      color: #fff8e8;
      background: rgba(10, 12, 22, .84);
      border-radius: 15px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .walk-guide.is-visible { display: block; }

    .walk-guide strong {
      display: block;
      margin-bottom: 5px;
      font-size: 1.02rem;
    }

    .walk-guide p {
      margin: 0;
      line-height: 1.55;
      font-size: .9rem;
    }

    .confirm-button {
      display: none;
      width: 100%;
      margin-top: 11px;
      padding: 13px 16px;
      color: #fff8e8;
      background: linear-gradient(180deg, #aa3b41, #7e222b);
      border: 1px solid #681a22;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
    }

    .confirm-button.is-visible { display: block; }

    .result-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(8, 10, 18, .50);
      backdrop-filter: blur(4px);
    }

    .result-overlay.is-visible { display: grid; }

    .result-card {
      width: min(100%, 430px);
      padding: 23px 20px;
      color: #281e29;
      background: rgba(246, 237, 218, .97);
      border-radius: 18px;
      text-align: center;
    }

    .festival-ticket {
      display: grid;
      width: 112px;
      height: 150px;
      margin: 0 auto 17px;
      place-items: center;
      color: #f8e5a8;
      background: #7e222b;
      border: 4px double #d7a84a;
      border-radius: 9px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 4.2rem;
    }

    .result-card h2 { margin: 0 0 10px; }
    .result-card p { margin: 0 0 16px; line-height: 1.7; }

    .result-card a {
      display: block;
      width: 100%;
      padding: 14px 16px;
      color: #fff8e8;
      background: linear-gradient(180deg, #aa3b41, #7e222b);
      border: 1px solid #681a22;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }

    .debug-box {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      z-index: 100;
      display: none;
      padding: 7px 10px;
      color: white;
      background: rgba(0, 0, 0, .72);
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
    }

    .debug-box.is-visible { display: block; }
  </style>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    AFRAME.registerComponent("fit-kioku-model", {
      schema: { size: { type: "number", default: 0.52 } },

      init() {
        this.el.addEventListener("model-loaded", () => {
          const mesh = this.el.getObject3D("mesh");
          if (!mesh) return;

          const box = new THREE.Box3().setFromObject(mesh);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const scale = this.data.size / Math.max(size.x, size.y, size.z);

          mesh.scale.setScalar(scale);
          mesh.position.set(
            -center.x * scale,
            -center.y * scale,
            -center.z * scale
          );
        });
      }
    });
  </script>
</head>

<body class="ar-page">
  <div class="ar-hud">
    <div class="ar-card">
      <h1>最初の祭札を探せ</h1>
      <p>
        D館入口の「D-Center」を写してください。
        模型が現れたら、看板をなるべく画面に残したまま
        階段とは反対側へゆっくり回り込み、
        「きおく」と読める場所を探してください。
      </p>
    </div>
  </div>

  <div class="ar-tip" id="arTip">D-Centerをカメラに映してください…</div>

  <div class="walk-guide" id="walkGuide">
    <strong id="guideTitle">そのまま、ゆっくり横へ</strong>
    <p id="guideText">D-Centerを画面から外さないようにして、少しずつ回り込んでください。</p>
    <button class="confirm-button" id="confirmButton" type="button">「きおく」と読めた！</button>
  </div>

  <div class="debug-box" id="debugBox">target: -</div>

  <div class="result-overlay" id="resultOverlay" aria-live="polite">
    <div class="result-card">
      <div class="festival-ticket" aria-label="祭札 ず">ず</div>
      <h2>最初の祭札を発見した！</h2>
      <p>「きおく」の形を見つけ、第一の記憶がよみがえった。祭札「ず」を取り戻した。</p>
      <a href="./index.html?v=13">本編に戻る</a>
    </div>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets/d-center.mind;
      autoStart: true;
      maxTrack: 1;
      warmupTolerance: 1;
      missTolerance: 18;
      filterMinCF: 0.001;
      filterBeta: 1000;
      uiScanning: true;
      uiLoading: true;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <a-asset-item id="kiokuAsset" src="./assets/models/kioku.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 5 target images: front -> deepest -->
    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity position="0 0.04 0.20">
        <a-entity gltf-model="#kiokuAsset" fit-kioku-model="size: 0.52" rotation="0 100 0"></a-entity>
      </a-entity>
      <a-entity light="type: ambient; intensity: 1.35"></a-entity>
      <a-entity light="type: directional; intensity: 1.15" position="-1 2 2"></a-entity>
    </a-entity>

    <a-entity id="target1" mindar-image-target="targetIndex: 1">
      <a-entity position="0.01 0.04 0.20">
        <a-entity gltf-model="#kiokuAsset" fit-kioku-model="size: 0.52" rotation="0 88 0"></a-entity>
      </a-entity>
      <a-entity light="type: ambient; intensity: 1.35"></a-entity>
      <a-entity light="type: directional; intensity: 1.15" position="-1 2 2"></a-entity>
    </a-entity>

    <a-entity id="target2" mindar-image-target="targetIndex: 2">
      <a-entity position="0.02 0.04 0.20">
        <a-entity gltf-model="#kiokuAsset" fit-kioku-model="size: 0.52" rotation="0 75 0"></a-entity>
      </a-entity>
      <a-entity light="type: ambient; intensity: 1.35"></a-entity>
      <a-entity light="type: directional; intensity: 1.15" position="-1 2 2"></a-entity>
    </a-entity>

    <a-entity id="target3" mindar-image-target="targetIndex: 3">
      <a-entity position="0.03 0.04 0.20">
        <a-entity gltf-model="#kiokuAsset" fit-kioku-model="size: 0.52" rotation="0 62 0"></a-entity>
      </a-entity>
      <a-entity light="type: ambient; intensity: 1.35"></a-entity>
      <a-entity light="type: directional; intensity: 1.15" position="-1 2 2"></a-entity>
    </a-entity>

    <a-entity id="target4" mindar-image-target="targetIndex: 4">
      <a-entity position="0.04 0.04 0.20">
        <a-entity gltf-model="#kiokuAsset" fit-kioku-model="size: 0.52" rotation="0 50 0"></a-entity>
      </a-entity>

      <a-ring
        color="#d7a84a"
        radius-inner="0.24"
        radius-outer="0.27"
        position="0 -0.09 0.03"
        opacity="0.8">
      </a-ring>

      <a-entity light="type: ambient; intensity: 1.35"></a-entity>
      <a-entity light="type: directional; intensity: 1.15" position="-1 2 2"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const arTip = document.getElementById("arTip");
    const walkGuide = document.getElementById("walkGuide");
    const guideTitle = document.getElementById("guideTitle");
    const guideText = document.getElementById("guideText");
    const confirmButton = document.getElementById("confirmButton");
    const resultOverlay = document.getElementById("resultOverlay");
    const debugBox = document.getElementById("debugBox");

    const params = new URLSearchParams(location.search);
    const debugMode = params.get("debug") === "1";
    if (debugMode) debugBox.classList.add("is-visible");

    const visibleTargets = new Set();
    let activeIndex = -1;
    let completed = localStorage.getItem("d-center-ar-success") === "true";

    const guideByIndex = [
      ["模型が現れた", "D-Centerを画面に残したまま、階段とは反対側へゆっくり移動してください。"],
      ["その調子", "少しずつ横へ。模型の文字の重なり方を見てください。"],
      ["半分くらい", "急がず、そのままもう少しだけ回り込もう。"],
      ["かなり近い", "文字がひとつの言葉になる場所を探してください。"],
      ["形が重なった", "何と読める？ 完成した模型をよく確認してください。"]
    ];

    function refreshGuide() {
      if (completed) return;

      if (activeIndex < 0) {
        walkGuide.classList.remove("is-visible");
        confirmButton.classList.remove("is-visible");
        arTip.style.display = "block";
        debugBox.textContent = "target: -";
        return;
      }

      arTip.style.display = "none";
      walkGuide.classList.add("is-visible");

      const [title, text] = guideByIndex[activeIndex] || guideByIndex[0];
      guideTitle.textContent = title;
      guideText.textContent = text;

      if (activeIndex === 4) {
        confirmButton.classList.add("is-visible");
      } else {
        confirmButton.classList.remove("is-visible");
      }

      debugBox.textContent = `target: ${activeIndex}`;
    }

    function setActiveFromVisible() {
      activeIndex = visibleTargets.size ? Math.max(...visibleTargets) : -1;
      refreshGuide();
    }

    for (let index = 0; index < 5; index += 1) {
      const target = document.getElementById(`target${index}`);

      target.addEventListener("targetFound", () => {
        visibleTargets.add(index);
        setActiveFromVisible();
      });

      target.addEventListener("targetLost", () => {
        visibleTargets.delete(index);
        setActiveFromVisible();
      });
    }

    confirmButton.addEventListener("click", () => {
      if (completed || activeIndex !== 4) return;

      completed = true;
      localStorage.setItem("d-center-ar-success", "true");
      walkGuide.classList.remove("is-visible");

      if (navigator.vibrate) navigator.vibrate([60, 40, 90]);
      resultOverlay.classList.add("is-visible");
    });
  </script>
</body>
</html>
