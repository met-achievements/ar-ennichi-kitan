<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>G館AR | 三つ目の祭札</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    html, body.ar-page { width:100%; height:100%; margin:0; overflow:hidden; background:transparent !important; }
    body.ar-page::after { display:none !important; }
    body.ar-page > video { position:fixed !important; inset:0 !important; width:100vw !important; height:100vh !important; object-fit:cover !important; z-index:-2 !important; }
    body.ar-page .a-canvas { position:fixed !important; inset:0 !important; z-index:-1 !important; }
  </style>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body class="ar-page">
  <div class="ar-hud">
    <div class="ar-card">
      <h1>三つ目の祭札を探せ</h1>
      <p>G館の前にある謎のオブジェクトをカメラに映そう！ オブジェクトと台座が画面の中央に入るよう、正面から写してください。</p>
    </div>
  </div>

  <div class="ar-tip" id="arTip">謎のオブジェクトをカメラに映してください…</div>

  <div class="ar-overlay" id="resultOverlay" aria-live="polite">
    <div class="ar-result">
      <img src="./assets/ui/festival-card-ko.svg" alt="祭札 こ">
      <h2>祭札「こ」を発見した！</h2>
      <p>縁日の記憶がひとつ、よみがえった。下のボタンから本編に戻ってください。</p>
      <a class="ar-button" href="./index.html">本編に戻る</a>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets/g-object.mind; autoStart: true; maxTrack: 1; uiScanning: true; uiLoading: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-assets>
      <img id="festivalCard" src="./assets/ui/festival-card-ko.svg" alt="祭札 こ">
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane src="#festivalCard" position="0 0.45 0" height="0.65" width="0.5" transparent="true"
        animation="property: position; to: 0 0.55 0; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine"></a-plane>
      <a-ring color="#d7a84a" radius-inner="0.28" radius-outer="0.31" position="0 0 0"></a-ring>
    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('#target');
    const resultOverlay = document.getElementById('resultOverlay');
    const arTip = document.getElementById('arTip');
    let found = false;
    target.addEventListener('targetFound', () => {
      if (found) return;
      found = true;
      localStorage.setItem('g-object-ar-success', 'true');
      resultOverlay.classList.add('is-visible');
      arTip.style.display = 'none';
    });
  </script>
</body>
</html>
